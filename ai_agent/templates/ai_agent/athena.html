<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0564F5">
<title>Athena Hospital</title>
<style>
  :root { --blue:#0564F5; --blue-dark:#044BBF; --soft:#639AE9; --red:#EA4758;
          --g1:#EFEFEF; --g2:#C5C4C5; --g3:#9C9D9E; --ink:#12203A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink);
         background:var(--g1); display:flex; justify-content:center; align-items:center; }
  button, a { font-family:inherit; }

  /* phone-like frame on desktop, full screen on phones */
  .phone { position:relative; width:100%; max-width:440px; height:100dvh; overflow:hidden; background:var(--g1); }
  @media (min-width:520px) {
    body { background:#DADADA; padding:24px; }
    .phone { height:min(860px, calc(100dvh - 48px)); border-radius:38px; box-shadow:0 30px 80px rgba(5,100,245,.28); }
  }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; }

  /* ---------- welcome screen ---------- */
  #startScreen { background:var(--blue); color:#fff; padding:20px 22px calc(18px + env(safe-area-inset-bottom)); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
  .logo { width:34px; height:34px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .langs { display:flex; gap:8px; margin-top:14px; }
  .langs button { border:1.5px solid rgba(255,255,255,.55); background:transparent; color:#fff; border-radius:999px;
                  padding:7px 14px; font-size:.9rem; font-weight:600; cursor:pointer; }
  .langs button.active { background:#fff; color:var(--blue); border-color:#fff; }
  .art { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 0; }
  .art svg { height:100%; max-height:300px; width:auto; }
  .hero-title { font-size:clamp(28px, 8vw, 36px); line-height:1.08; font-weight:800; margin:0 0 8px; }
  .tag { margin:0 0 16px; opacity:.88; line-height:1.4; }
  .callBtn { width:100%; border:0; cursor:pointer; background:#fff; color:var(--blue); border-radius:999px; padding:16px;
             font-size:1.1rem; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px;
             box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .auth { display:flex; gap:10px; margin-top:10px; }
  .pill { flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; color:var(--ink);
          text-decoration:none; border-radius:999px; padding:7px 7px 7px 18px; font-weight:700; font-size:.95rem; }
  .arrow { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex:none; }
  .arrow.light { background:var(--g1); color:var(--blue); }
  .arrow.dark { background:var(--blue); color:#fff; }
  .doctor { display:block; text-align:center; color:#fff; opacity:.9; font-size:.88rem; margin-top:10px; }
  .sos { margin-top:12px; background:var(--red); color:#fff; border-radius:14px; padding:9px 12px; font-size:.88rem; text-align:center; }
  .sos a { color:#fff; font-weight:800; }
  .note { font-size:.75rem; opacity:.8; text-align:center; margin:10px 0 0; }

  /* ---------- call screen ---------- */
  #callScreen { display:none; background:var(--g1); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 18px 8px; }
  .who { display:flex; align-items:center; gap:12px; }
  .avatar { width:52px; height:52px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 14px rgba(5,100,245,.18); }
  .avatar.talking { animation:ring 1.2s infinite; }
  @keyframes ring { 0%{box-shadow:0 0 0 0 rgba(5,100,245,.45)} 100%{box-shadow:0 0 0 20px rgba(5,100,245,0)} }
  .name { font-weight:800; font-size:1.1rem; }
  .small { font-size:.82rem; color:var(--g3); }
  .timer { background:#fff; border-radius:999px; padding:7px 14px; font-weight:700; font-variant-numeric:tabular-nums; }
  #log { flex:1; min-height:0; overflow:auto; padding:8px 16px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:86%; padding:11px 15px; border-radius:20px; line-height:1.4; background:#fff;
            box-shadow:0 2px 10px rgba(18,32,58,.06); border-end-start-radius:6px; }
  .bubble.me { background:var(--blue); color:#fff; margin-inline-start:auto; border-end-start-radius:20px; border-end-end-radius:6px; }
  .sheet { background:#fff; border-radius:28px 28px 0 0; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
           box-shadow:0 -10px 30px rgba(18,32,58,.08); }
  #status { text-align:center; color:var(--g3); min-height:1.3em; margin-bottom:10px; font-size:.92rem; }
  .actions { display:flex; gap:12px; align-items:center; }
  #micBtn { flex:1; border:0; cursor:pointer; background:var(--blue); color:#fff; border-radius:999px; padding:18px;
            font-size:1.1rem; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px; }
  #micBtn:disabled { background:var(--soft); opacity:.75; cursor:default; }
  #micBtn.rec { background:var(--red); animation:pulse2 1s infinite; }
  @keyframes pulse2 { 0%{box-shadow:0 0 0 0 rgba(234,71,88,.5)} 100%{box-shadow:0 0 0 18px rgba(234,71,88,0)} }
  #hangBtn { width:60px; height:60px; flex:none; border:0; border-radius:50%; background:var(--red); cursor:pointer;
             display:flex; align-items:center; justify-content:center; }
  .sos-mini { text-align:center; font-size:.8rem; color:var(--g3); margin-top:10px; }
  .sos-mini a { color:var(--red); font-weight:700; }
</style>
</head>

  ar: { tap: "اضغط للتحدث", send: "اضغط للإرسال", wait: "أثينا تفكر…", turn: "دورك: اضغط على الميكرو",
        talk: "أثينا تتكلم…", nothing: "ما سمعت شيء، عاود جرب.", err: "عفوا، صار مشكل. عاود جرب." },
  en: { tap: "Tap to talk", send: "Tap to send", wait: "Athena is thinking…", turn: "Your turn: tap the microphone",
        talk: "Athena is speaking…", nothing: "I didn't hear anything, try again.", err: "Sorry, something went wrong. Try again." }
};

let curLang = "fr";
let calling = false, state = "idle", stream = null, rec = null, chunks = [], timerId = null, seconds = 0;
const player = new Audio();
const lang = () => curLang;
const t = k => T[curLang][k];
const micLabel = k => MIC_SVG + "<span>" + t(k) + "</span>";

function applyLang(code) {
  curLang = code;
  document.documentElement.lang = code;
  document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
  const u = UI[code];
  setText("title", u.title); setText("tag", u.tag); setText("callTxt", u.call);
  setText("backLink", u.back); setText("who", u.who); setText("note", u.note);
  $("hangBtn").setAttribute("aria-label", u.hang); $("hangBtn").title = u.hang;
  $("sos").innerHTML = u.sos; $("sos2").innerHTML = u.sos;
  $("micBtn").innerHTML = micLabel("tap");
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("active", b.dataset.lang === code));
}
document.querySelectorAll(".langs button").forEach(b => { b.onclick = () => applyLang(b.dataset.lang); });
applyLang("fr");

function setStatus(s) { $("status").textContent = s; }
function addLine(who, text) {
  const d = document.createElement("div");
  d.className = "bubble" + (who === "me" ? " me" : "");
  d.dir = "auto";
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function cleanForSpeech(s) { return s.replace(/[*#_`>~]+/g, " ").replace(/\s-\s/g, ", ").replace(/\s+/g, " ").trim(); }

function ready() {
  if (!calling) return;
  state = "idle";
  $("micBtn").disabled = false;
  $("micBtn").className = "";
  $("micBtn").innerHTML = micLabel("tap");
  $("avatar").classList.remove("talking");
  setStatus(t("turn"));
}

function browserSpeak(clean) {
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = TTS_LANG[lang()];
  u.onend = ready;
  u.onerror = ready;
  speechSynthesis.speak(u);
}

async function speak(text) {
  speechSynthesis.cancel();
  player.pause();
  state = "speaking";
  $("avatar").classList.add("talking");
  setStatus(t("talk"));
  const clean = cleanForSpeech(text);
  try {
    const r = await fetch("/api/tts/", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: JSON.stringify({ text: clean, lang: lang() })
    });
    if (!r.ok) throw new Error("tts");
    player.src = URL.createObjectURL(await r.blob());
    player.onended = ready;
    player.onerror = ready;
    await player.play();
  } catch (e) {
    browserSpeak(clean);
  }
}

async function startRec() {
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
             : MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start();
  state = "recording";
  $("micBtn").className = "rec";
  $("micBtn").innerHTML = micLabel("send");
  $("avatar").classList.remove("talking");
  setStatus("🎙️ …");
}

function stopRec() { if (rec && rec.state !== "inactive") rec.stop(); }

async function onRecStop() {
  if (!calling) return;
  state = "thinking";
  $("micBtn").disabled = true;
  $("micBtn").className = "";
  setStatus(t("wait"));
  const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
  if (blob.size < 2000) { addLine("ath", t("nothing")); ready(); return; }

  let text = "";
  try {
    const fd = new FormData();
    fd.append("audio", blob, "speech");
    fd.append("lang", lang());
    const r = await fetch("/api/transcribe/", { method: "POST", headers: { "X-CSRFToken": csrf }, body: fd });
    if (r.status === 401) { location.href = "/login/"; return; }
    text = ((await r.json()).text || "").trim();
  } catch (e) {}
  if (!calling) return;
  if (!text) { addLine("ath", t("nothing")); ready(); return; }

  addLine("me", text);
  let reply = t("err");
  try {
    const r = await fetch("/api/chat/", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf },
      body: JSON.stringify({ message: text, lang: lang() })
    });
    if (r.status === 401) { location.href = "/login/"; return; }
    const data = await r.json();
    if (data.reply) reply = data.reply;
  } catch (e) {}
  if (!calling) return;
  addLine("ath", reply);
  speak(reply);
}

$("micBtn").onclick = async () => {
  if (state === "recording") { stopRec(); return; }
  if (state === "thinking") return;
  speechSynthesis.cancel();
  player.pause();
  try { await startRec(); } catch (e) { setStatus(t("err")); }
};

$("callBtn").onclick = async () => {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    alert("Ce navigateur ne permet pas d'enregistrer la voix. Utilisez Chrome (Android) ou Safari (iPhone).");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    alert("Le micro est refusé. Autorisez-le dans les réglages du navigateur, puis réessayez.");
    return;
  }
  calling = true; seconds = 0;
  $("log").innerHTML = "";
  $("startScreen").style.display = "none";
  $("callScreen").style.display = "flex";
  $("micBtn").disabled = true;
  $("micBtn").innerHTML = micLabel("tap");
  timerId = setInterval(() => {
    seconds++;
    $("timer").textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
  }, 1000);
  const greet = GREETINGS[lang()];
  addLine("ath", greet);
  speak(greet);
};

$("hangBtn").onclick = () => {
  calling = false; state = "idle";
  if (rec && rec.state !== "inactive") { rec.onstop = null; rec.stop(); }
  if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  speechSynthesis.cancel();
  player.pause();
  clearInterval(timerId);
  $("timer").textContent = "00:00";
  fetch("/api/reset/", { method: "POST", headers: { "X-CSRFToken": csrf } });
  $("avatar").classList.remove("talking");
  $("callScreen").style.display = "none";
  $("startScreen").style.display = "flex";
};
</script>
</body>
</html>
