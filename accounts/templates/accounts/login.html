{% extends "accounts/base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
  <h1>Connexion</h1>
  <p class="sub">Patients et médecins</p>
  {% if form.errors %}<div class="err">Identifiant ou mot de passe incorrect.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Identifiant</label>
    <input name="username" autocomplete="username" required autofocus>
    <label>Mot de passe</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Se connecter</button>
  </form>
  <div class="links">
    <a href="{% url 'patient_signup' %}">Créer un compte patient</a><br>
    <a href="{% url 'doctor_signup' %}">Créer un compte médecin</a>
  </div>
{% endblock %}
