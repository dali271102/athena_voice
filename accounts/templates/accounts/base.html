<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0564F5">
<title>{% block title %}Athena Hospital{% endblock %}</title>
<style>
  :root { --blue:#0564F5; --blue-dark:#044BBF; --soft:#639AE9; --red:#EA4758;
          --g1:#EFEFEF; --g2:#C5C4C5; --g3:#9C9D9E; --ink:#12203A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--g1); color:var(--ink); }
  .hero { background:var(--blue); color:#fff; padding:20px 20px 74px; border-radius:0 0 34px 34px; }
  .hero-in { max-width:520px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; color:#fff; text-decoration:none; }
  .logo { width:34px; height:34px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .back { color:#fff; text-decoration:none; font-size:.9rem; opacity:.9; border:1.5px solid rgba(255,255,255,.55);
          border-radius:999px; padding:6px 14px; }
  .wrap { max-width:520px; margin:-52px auto 0; padding:0 16px 32px; }
  .card { background:#fff; border-radius:28px; box-shadow:0 12px 40px rgba(5,100,245,.14); padding:26px 22px; }
  h1 { color:var(--blue); margin:0 0 6px; font-size:1.7rem; line-height:1.1; }
  h2 { margin:26px 0 6px; font-size:1.15rem; }
  .sub { color:var(--g3); margin:0 0 18px; line-height:1.4; }
  label { display:block; font-weight:700; margin-top:14px; font-size:.92rem; }
  input, select { width:100%; padding:14px 16px; margin-top:6px; border:2px solid transparent; border-radius:16px;
                  font-size:1rem; background:var(--g1); color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--blue); background:#fff; }
  .help { font-size:.78rem; color:var(--g3); margin-top:5px; line-height:1.35; }
  .help ul { margin:4px 0 0; padding-inline-start:18px; }
  .err { color:var(--red); font-size:.88rem; margin-top:5px; font-weight:600; }
  .btn { display:block; width:100%; text-align:center; margin-top:20px; padding:16px; background:var(--blue); color:#fff;
         border:0; border-radius:999px; font-size:1.05rem; font-weight:800; cursor:pointer; text-decoration:none; }
  .btn:hover { background:var(--blue-dark); }
  .btn.grey { background:var(--g3); }
  .links { margin-top:18px; text-align:center; font-size:.93rem; line-height:1.9; }
  .links a { color:var(--blue); font-weight:600; }
  .banner { background:#FFF4D6; border:1px solid #F0D58A; color:#7A5A00; border-radius:18px; padding:13px 15px; margin:14px 0; line-height:1.4; }
  .appt { background:var(--g1); border-radius:18px; padding:13px 15px; margin:10px 0; border-inline-start:5px solid var(--blue); }
  .when { font-weight:800; color:var(--blue); }
  .muted { color:var(--g3); }
  header.top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  form.inline button { padding:9px 18px; border:0; border-radius:999px; background:var(--g1); color:var(--ink); font-weight:700; cursor:pointer; }
  small { color:var(--g3); }
  .banner.success { background:#E4F6EA; border-color:#9BD7AE; color:#14663A; }
  .banner.error { background:#FDE8EB; border-color:#F3A9B3; color:#9E2434; }
  .opt { display:block; text-decoration:none; color:inherit; border-radius:22px; padding:18px; margin:12px 0;
         background:var(--g1); border:2px solid transparent; }
  .opt:hover { border-color:var(--blue); }
  .opt.primary { background:var(--blue); color:#fff; }
  .opt .t { font-weight:800; font-size:1.1rem; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .opt .d { margin-top:6px; opacity:.85; font-size:.92rem; line-height:1.4; }
  .opt .go { width:34px; height:34px; border-radius:50%; background:var(--blue); color:#fff; display:flex;
             align-items:center; justify-content:center; flex:none; }
  .opt.primary .go { background:#fff; color:var(--blue); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 0 12px; }
  .chip { flex:none; padding:9px 14px; border-radius:999px; background:var(--g1); color:var(--ink); text-decoration:none;
          font-weight:700; font-size:.9rem; text-align:center; }
  .chip.active { background:var(--blue); color:#fff; }
  .docbox { background:var(--g1); border-radius:20px; padding:14px 16px; margin:12px 0; }
  .slots { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .slot { position:relative; }
  .slot input { position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }
  .slot span { display:inline-block; padding:10px 14px; border-radius:999px; background:#fff; border:2px solid var(--g2);
               font-weight:700; cursor:pointer; }
  .slot input:checked + span { background:var(--blue); border-color:var(--blue); color:#fff; }
  .slot input:focus-visible + span { outline:3px solid var(--soft); }
  textarea { width:100%; padding:14px 16px; margin-top:6px; border:2px solid transparent; border-radius:16px; font-size:1rem;
             background:var(--g1); color:var(--ink); font-family:inherit; min-height:84px; }
  textarea:focus { outline:none; border-color:var(--blue); background:#fff; }
  .btn[disabled] { background:var(--g2); cursor:not-allowed; }

  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .mini { padding:8px 14px; border:0; border-radius:999px; font-size:.85rem; font-weight:700; cursor:pointer;
          background:#fff; color:var(--red); border:1.5px solid var(--red); }
  .mini.blue { color:var(--blue); border-color:var(--blue); text-decoration:none; display:inline-block; }
  .cancel-form { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .cancel-form input { margin:0; padding:9px 12px; flex:1; min-width:140px; font-size:.9rem; }
  .appt.cancelled { border-inline-start-color:var(--g2); opacity:.8; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hrow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; margin:8px 0;
          background:var(--g1); border-radius:16px; }
  @media (max-width:420px) { .two { grid-template-columns:1fr; } }
  .crumb { display:inline-block; margin-bottom:10px; color:var(--blue); font-weight:700; text-decoration:none; }

</style>
</head>
<body>
<div class="hero">
  <div class="hero-in">
    <a class="brand" href="/">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0564F5"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span>
      Athena Hospital
    </a>
    <a class="back" href="/">← Athena</a>
  </div>
</div>
<div class="wrap">
  <div class="card">
    {% if messages %}{% for m in messages %}<div class="banner {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
